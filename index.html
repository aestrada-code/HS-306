const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const $=id=>document.getElementById(id);

function unique(arr){
  return [...new Set(arr.filter(v=>v!==null&&v!==undefined&&v!==''))];
}

function fillFilters(){
  unique(inventory.map(x=>x.category)).forEach(v=>{
    $('category').insertAdjacentHTML(
      'beforeend',
      `<option>${esc(v)}</option>`
    );
  });

  unique(inventory.map(x=>x.cabinet)).forEach(v=>{
    $('cabinet').insertAdjacentHTML(
      'beforeend',
      `<option>${esc(v)}</option>`
    );
  });
}

/*
  Kit research data.
  If you already have your researched kitResearch block elsewhere,
  keep that block and remove this empty fallback.
*/
const kitResearch=[];

function renderKits(){
  $('kitGrid').innerHTML=kitResearch.map(k=>`
    <article class="kit">
      <div class="icon">🧬</div>
      <h3>${esc(k.name)}</h3>
      <span class="tag">${esc(k.brand)}</span>
      <p>${esc(k.description)}</p>
      <strong>Reported components</strong>
      <ul>
        ${k.components.map(c=>`<li>${esc(c)}</li>`).join('')}
      </ul>
      <div class="links">
        <a class="btn" target="_blank" rel="noopener" href="${k.source}">
          Manufacturer source ↗
        </a>
        <a class="btn green" target="_blank" rel="noopener" href="${k.video}">
          Videos / demos ↗
        </a>
      </div>
    </article>
  `).join('');
}

function render(){
  const q=$('search').value.toLowerCase().trim();
  const cat=$('category').value;
  const sub=$('subcat').value;
  const cab=$('cabinet').value;

  const filtered=inventory.filter(x=>
    (!q||Object.values(x).join(' ').toLowerCase().includes(q))&&
    (!cat||x.category===cat)&&
    (!sub||x.subcategory===sub)&&
    (!cab||x.cabinet===cab)
  );

  $('tbody').innerHTML=filtered.map(x=>`
    <tr>
      <td class="cab">${esc(x.cabinet)}</td>
      <td><strong>${esc(x.name)}</strong></td>
      <td class="stock">${esc(x.stock)}</td>
      <td><span class="tag">${esc(x.category)}</span></td>
      <td>${esc(x.subcategory)}</td>
      <td>${esc(x.room)}</td>
    </tr>
  `).join('');

  $('empty').hidden=filtered.length>0;
  $('count').textContent=filtered.length+' items';
}

$('total').textContent=inventory.length;
$('kits').textContent=inventory.filter(x=>x.subcategory==='Kit').length;
$('equipment').textContent=inventory.filter(x=>x.subcategory==='Equipment').length;
$('cabinets').textContent=unique(inventory.map(x=>x.cabinet)).length;

fillFilters();
renderKits();
render();

['search','category','subcat','cabinet'].forEach(id=>
  $(id).addEventListener('input',render)
);
</script>
